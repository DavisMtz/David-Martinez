name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npx react-router typegen
      - run: npx tsc --noEmit
      - run: npm run build
